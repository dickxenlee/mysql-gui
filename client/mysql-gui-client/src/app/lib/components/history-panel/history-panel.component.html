<aside
    class="flex h-full flex-shrink-0 flex-col border-l border-gray-300 bg-gray-50 text-gray-800 transition-[width] duration-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100"
    [ngClass]="collapsed ? 'w-12' : 'w-80'"
>
    <div class="flex h-12 items-center justify-between border-b border-gray-300 px-2 dark:border-gray-700">
        <div *ngIf="!collapsed" class="flex items-center gap-2">
            <span class="icon-[carbon--time] text-lg"></span>
            <h2 class="text-sm font-bold">Query History</h2>
            <span class="rounded-full bg-gray-200 px-2 py-0.5 text-xs dark:bg-gray-700">{{ records.length }}</span>
        </div>
        <button
            type="button"
            (click)="toggleCollapsed()"
            [attr.aria-label]="collapsed ? 'Expand query history' : 'Collapse query history'"
            class="rounded p-2 hover:bg-gray-200 dark:hover:bg-gray-700"
        >
            <span [ngClass]="collapsed ? 'icon-[carbon--chevron-left]' : 'icon-[carbon--chevron-right]'"></span>
        </button>
    </div>

    <ng-container *ngIf="!collapsed">
        <div class="flex items-center justify-between border-b border-gray-200 px-3 py-2 dark:border-gray-700">
            <p class="text-xs text-gray-500 dark:text-gray-400">Newest queries first</p>
            <button
                type="button"
                (click)="requestClear()"
                [disabled]="loading || records.length === 0"
                class="rounded px-2 py-1 text-xs font-semibold text-red-600 hover:bg-red-50 disabled:cursor-not-allowed disabled:opacity-40 dark:text-red-400 dark:hover:bg-red-950"
            >
                Clear history
            </button>
        </div>

        <div *ngIf="loading" class="flex flex-1 items-center justify-center p-4 text-sm text-gray-500">
            Loading query history...
        </div>
        <div *ngIf="!loading && error" class="m-3 rounded-md border border-red-300 bg-red-50 p-3 text-sm text-red-700 dark:border-red-800 dark:bg-red-950 dark:text-red-300">
            {{ error }}
        </div>
        <div *ngIf="!loading && !error && records.length === 0" class="flex flex-1 flex-col items-center justify-center p-6 text-center">
            <span class="icon-[carbon--query] mb-3 text-3xl text-gray-400"></span>
            <p class="text-sm font-semibold">No query history yet</p>
            <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Executed queries will appear here.</p>
        </div>

        <ol *ngIf="!loading && !error && records.length > 0" class="flex-1 space-y-2 overflow-y-auto p-2">
            <li *ngFor="let record of sortedRecords; trackBy: trackById">
                <button
                    type="button"
                    (click)="restore(record)"
                    class="w-full rounded-md border border-gray-200 bg-white p-3 text-left shadow-sm transition hover:border-blue-400 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 dark:border-gray-700 dark:bg-gray-800 dark:hover:border-blue-500 dark:hover:bg-gray-700"
                >
                    <div class="mb-2 flex items-center justify-between gap-2 text-xs">
                        <span class="truncate font-semibold">{{ record.database }}</span>
                        <span
                            class="rounded-full px-2 py-0.5 font-semibold"
                            [ngClass]="record.status === 'success' ? 'bg-green-100 text-green-700 dark:bg-green-950 dark:text-green-300' : 'bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300'"
                        >
                            {{ record.status }}
                        </span>
                    </div>
                    <code class="block max-h-16 overflow-hidden whitespace-pre-wrap break-words text-xs text-gray-700 dark:text-gray-200">{{ record.query }}</code>
                    <div class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-[11px] text-gray-500 dark:text-gray-400">
                        <span>{{ record.timestamp | date : 'medium' }}</span>
                        <span>{{ record.durationMs }} ms</span>
                        <span class="uppercase">{{ record.source }}</span>
                    </div>
                    <p *ngIf="record.prompt" class="mt-2 truncate text-[11px] italic text-purple-600 dark:text-purple-400">
                        “{{ record.prompt }}”
                    </p>
                </button>
            </li>
        </ol>
    </ng-container>
</aside>
